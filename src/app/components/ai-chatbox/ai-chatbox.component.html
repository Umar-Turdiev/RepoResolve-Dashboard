<div class="chat">
  <div class="chat-header">
    <h1 class="title">AI Assistant</h1>

    <div class="chat-tabs">
      <button
        class="tab"
        [class.active]="activeTab() === 'chat'"
        (click)="setTab('chat')"
        type="button"
      >
        Chat
      </button>
      <button
        class="tab"
        *ngIf="showWorkflow()"
        [class.active]="activeTab() === 'workflow'"
        (click)="setTab('workflow')"
        type="button"
      >
        Workflow
      </button>
    </div>
  </div>

  <div
    class="workflow-panel"
    *ngIf="showWorkflow() && activeTab() === 'workflow'"
  >
    <div class="workflow-title">Workflow</div>
    <div class="workflow-graph">
      <div class="workflow-column">
        <div class="workflow-node" *ngFor="let n of tinyfishNodes()">
          <div class="node-card">
            <div class="node-label">{{ n.label }}</div>
            <div class="status-wrap">
              <div class="node-status" [class]="statusClass(n.status)">
                <span class="dot" *ngIf="statusLabel(n.status)"></span>
                <span class="label">{{ statusLabel(n.status) }}</span>
              </div>
              <button class="skip-btn" type="button" (click)="skipTinyfish()">
                Skip
              </button>
              <div class="inspect-pop">
                <div class="inspect-title">Logs</div>
                <div class="inspect-empty" *ngIf="!logsFor(n.step).length">
                  No message yet.
                </div>
                <pre class="inspect-log" *ngIf="logsFor(n.step).length">{{
                  logsFor(n.step).join("\n")
                }}</pre>
              </div>
            </div>
          </div>
          <div class="connector"></div>
        </div>
      </div>
      <div class="workflow-column">
        <div class="workflow-node" *ngFor="let n of codepatchNodes()">
          <div class="node-card">
            <div class="node-label">{{ n.label }}</div>
            <div class="status-wrap">
              <div class="node-status" [class]="statusClass(n.status)">
                <span class="dot" *ngIf="statusLabel(n.status)"></span>
                <span class="label">{{ statusLabel(n.status) }}</span>
              </div>
              <div class="inspect-pop">
                <div class="inspect-title">Logs</div>
                <!-- <div class="inspect-empty" *ngIf="!logsFor(n.step).length"> -->
                <div class="inspect-empty">
                  No message yet.
                </div>
                <pre class="inspect-log" *ngIf="logsFor(n.step).length">{{
                  logsFor(n.step).join("\n")
                }}</pre>
              </div>
            </div>
          </div>
          <div class="connector"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-body" #scroll *ngIf="activeTab() === 'chat'">
    <div
      *ngFor="let m of messages"
      class="msg"
      [class.ai]="m.role === 'assistant'"
    >
      <div class="bubble prose" [innerHTML]="m.content | md"></div>
    </div>
    <div *ngIf="streaming" class="typing">▌</div>
  </div>

  <form class="chat-input" (ngSubmit)="send()" autocomplete="off">
    <div class="input-wrap bg-opaque">
      <textarea
        #ta
        [(ngModel)]="draft"
        name="draft"
        rows="1"
        placeholder="Ask anything…"
        (input)="ta.style.height = 'auto'"
      ></textarea>

      <button
        type="button"
        class="send-btn"
        [class.is-stop]="streaming"
        [disabled]="(!draft || !draft.trim()) && !streaming"
        (click)="streaming ? stop() : send()"
        [attr.aria-label]="streaming ? 'Stop' : 'Send'"
        [attr.title]="streaming ? 'Stop' : 'Send'"
      >
        <!-- Send (up arrow) -->
        <svg
          *ngIf="!streaming"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
        >
          <path
            d="M3.4 20.6L22 12 3.4 3.4l3.2 6.9L14 12l-7.4 1.7-3.2 6.9z"
            fill="currentColor"
          />
        </svg>
        <!-- Stop -->
        <svg
          *ngIf="streaming"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
        >
          <rect
            x="6"
            y="6"
            width="12"
            height="12"
            rx="2"
            ry="2"
            fill="currentColor"
          />
        </svg>
      </button>
    </div>
  </form>
</div>
